<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ackajitto | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            /* ตั้งค่าพื้นหลังด้วย Image.png */
            background-image: url('Image.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        
        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">

    <div class="glass-card w-full max-w-2xl rounded-[40px] p-6 md:p-10 shadow-2xl">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-block p-4 rounded-full bg-blue-100/50 mb-4">
                <span class="text-4xl">💠</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Ackajitto</h1>
            <p class="text-gray-600 mt-2">รวมเว็บแอปและเครื่องมือออนไลน์</p>
        </header>

        <!-- Search Bar -->
        <div class="mb-8">
            <div class="relative">
                <input type="text" placeholder="Search..." class="w-full py-3 px-6 rounded-full bg-white/60 border border-white/50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
                <span class="absolute right-4 top-3 text-gray-400">🔍</span>
            </div>
        </div>

        <main>
            <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center">
                <span class="mr-2">🧘</span> เว็บแอปธรรมะ
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <a href="https://ackajitto.github.io/meditation-timer/" target="_blank" class="bg-white/40 p-4 rounded-2xl hover:bg-white/60 transition-all border border-white/30 flex items-center gap-4">
                    <span class="text-3xl">⏱️</span>
                    <div>
                        <h3 class="font-bold text-gray-800">Meditation Timer</h3>
                        <p class="text-sm text-gray-600">บันทึกเวลาและติดตามการนั่งสมาธิ</p>
                    </div>
                </a>
                <a href="https://ackajitto.github.io/dharma_prayer/" target="_blank" class="bg-white/40 p-4 rounded-2xl hover:bg-white/60 transition-all border border-white/30 flex items-center gap-4">
                    <span class="text-3xl">📖</span>
                    <div>
                        <h3 class="font-bold text-gray-800">บทสวดมนต์</h3>
                        <p class="text-sm text-gray-600">รวมบทสวดมนต์และบทแผ่เมตตา</p>
                    </div>
                </a>
                <a href="https://ackajitto.github.io/lamp-days/" target="_blank" class="bg-white/40 p-4 rounded-2xl hover:bg-white/60 transition-all border border-white/30 flex items-center gap-4">
                    <span class="text-3xl">🔥</span>
                    <div>
                        <h3 class="font-bold text-gray-800">วันถวายประทีป</h3>
                        <p class="text-sm text-gray-600">ติดตามจำนวนวันถวายประทีป</p>
                    </div>
                </a>
            </div>

            <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center">
                <span class="mr-2">🛠️</span> เครื่องมือออนไลน์
            </h2>
            <div class="grid grid-cols-1 gap-4">
                <a href="https://ackajitto.github.io/pdf-to-image-hd/" target="_blank" class="bg-white/40 p-4 rounded-2xl hover:bg-white/60 transition-all border border-white/30 flex items-center gap-4">
                    <span class="text-3xl">🖼️</span>
                    <div>
                        <h3 class="font-bold text-gray-800">PDF to Image HD</h3>
                        <p class="text-sm text-gray-600">แปลงไฟล์ PDF เป็นรูปภาพคุณภาพสูง</p>
                    </div>
                </a>
            </div>
        </main>

        <footer class="mt-10 pt-6 border-t border-gray-200/50 flex justify-center gap-6">
            <a href="#" class="text-2xl hover:scale-110 transition-transform">🐙</a>
            <a href="#" class="text-2xl hover:scale-110 transition-transform">📸</a>
            <a href="#" class="text-2xl hover:scale-110 transition-transform">🐦</a>
            <a href="#" class="text-2xl hover:scale-110 transition-transform">💬</a>
        </footer>
    </div>

</body>
</html>
